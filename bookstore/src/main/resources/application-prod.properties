server.port=${SERVER_PORT:8080}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.frontend-url=${FRONTEND_URL}

# DB
spring.datasource.url=${POSTGRES_DATASOURCE_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}

# JWT
spring.security.oauth2.resourceserver.jwt.public-key-location=classpath:certs/public.pem
spring.security.oauth2.resourceserver.jwt.private-key-location=classpath:certs/private.pem

# JWT
app.jwt-token-expiration-seconds=${JWT_TOKEN_EXPIRATION_SECONDS:900}
app.jwt-refresh-expiration-seconds=${JWT_REFRESH_EXPIRATION_SECONDS:86400}
