services:
  postgresql-db:
    image: postgres:15
    container_name: postgres
    restart: always
    ports:
      - "54320:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./seeds:/docker-entrypoint-initdb.d/seeds

volumes:
  postgres-data:
